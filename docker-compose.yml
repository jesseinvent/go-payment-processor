services:
  payment-processor:
    build: .
    ports:
      - "5001:5001"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=postgres 
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_URL=postgres://user:password@postgres-db:5432/postgres?sslmode=disable
      - REDIS_URL=redis:6379
    
    depends_on:
      - postgres-db
      - redis  

  postgres-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data  

  redis:
    image: redis:latest
    ports:
      - "6379:6379"    

volumes:
  postgres-data: 

