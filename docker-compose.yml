services:
  payment-processor:
    build: .
    ports:
      - "5001:5001"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=postgres 
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_URL=postgres://user:password@postgres-db:5432/postgres?sslmode=disable
      - REDIS_URL=redis:6379
    
    depends_on:
      - postgres-db
      - redis  

  migration:
    build: .
    run: |
      curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xvz
      sudo mv migrate /usr/local/bin/
    command: ["make", "migrate-up"]
    environment:
      - DB_URL=postgres://user:password@postgres-db:5432/postgres?sslmode=disable
    depends_on:
      - postgres-db    

  postgres-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"    


