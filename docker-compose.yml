services:
  payment-processor:
    build: .
    ports:
      - "5001:5001"
    env_file:
      - .env
    
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_started

  postgres-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
          

