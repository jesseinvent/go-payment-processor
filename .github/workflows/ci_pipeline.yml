name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    pipeline:
        name: CI Pipeline
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Set up Go
              uses: actions/setup-go@v3
              with:
                  go-version-file: go.mod
            - name: Install golangci-lint
              run: |
                go install golang.org/x/vuln/cmd/govulncheck@latest
                govulncheck ./...

            - name: Vet
              run: |
                  make vet

            - name: Run Linter
              uses: golangci/golangci-lint-action@v9
              with:
                version: latest
                args: --timeout 5m
                    
            - name: Run Tests
              run: |
                 make test

            - name: Vulnerability Check
              run: |
                go install golang.org/x/vuln/cmd/govulncheck@latest
                govulncheck ./...

    docker_build:
        name: Build Docker Image
        runs-on: ubuntu-latest
        needs: pipeline
        steps:
            - uses: actions/checkout@v3
            - name: Build Docker Image
              run: |
                 make build-docker